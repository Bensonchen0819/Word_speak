<head>

<title>Engineering English｜隨機選擇題＋固定選項複習</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:#fff;border-bottom:1px solid #e5e9f0;padding:22px 16px}
.header-inner,main{max-width:980px;margin:0 auto}
h1{margin:0;font-size:28px} .subtitle{margin-top:6px;color:#667085}
main{padding:24px 14px 50px}
.card{background:#fff;border:1px solid #dfe5ee;border-radius:22px;padding:22px;box-shadow:0 8px 26px rgba(31,45,61,.07)}

.tip{color:#667085;font-size:14px;margin-top:8px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.option{min-height:70px;border:2px solid #d7dee9;background:#fff;border-radius:16px;padding:13px 16px;text-align:left;font-size:18px;font-weight:800;cursor:pointer}
.option:hover{border-color:#7aa7f7} .option.correct{background:#eaf9ef;border-color:#2a9d5b;color:#146c3e}
.option.wrong{background:#fff0f0;border-color:#d92d20;color:#b42318} .option.disabled{cursor:default}
.result{margin-top:18px;padding:17px;border-radius:16px;background:#f7fbf8;border:1px solid #b7dfc8}
.hidden{display:none} .result-title{font-size:20px;font-weight:900;margin-bottom:12px}
.result-title.ok{color:#147a4b} .result-title.bad{color:#b42318}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.summary-item{background:#fff;border:1px solid #e0e5ec;border-radius:12px;padding:12px}
.summary-label{display:block;font-size:12px;color:#667085;margin-bottom:5px}
.summary-value{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.example{margin-top:12px;line-height:1.6}
.review{margin-top:15px;padding-top:13px;border-top:1px dashed #ccd5e1}
.review-title{font-size:14px;font-weight:900;margin-bottom:9px;color:#475467}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.review-item{background:#fff;border:1px solid #dfe5ee;border-radius:11px;padding:10px 12px}
.review-item.answer{background:#f0faf4;border-color:#78c49b}
.review-en{font-weight:850} .review-zh{margin-top:4px;color:#15803d;font-size:13px}
.actions{display:flex;gap:10px;margin-top:18px}

button.primary{background:#2456a6;color:#fff;border-color:#2456a6}
.status{min-height:23px;margin-top:12px;color:#667085}
.status.ok{color:#147a4b;font-weight:800} .status.bad{color:#b42318;font-weight:800}
.score-card{margin-top:16px;text-align:center} .score{font-size:32px;font-weight:900}
.note{margin-top:9px;font-size:13px;color:#667085}

<header><div class="header-inner">

<main>
<section class="card">

<div id="result" class="result hidden">

<div class="summary">

<div id="example" class="example"></div>

  <div id="targetWord" class="target-word"></div>
  <div class="speaking-actions">

  <div id="speechResult" class="speech-result">尚未辨識</div>

<div class="review">
<div class="review-title">🔄 交叉複習：原本這一題的 4 個選項</div>
<div id="reviewGrid" class="review-grid"></div>
</div>
</div>
<div class="actions">
<button id="showAnswer" class="action" type="button">👁 顯示答案</button>
<button id="next" class="action primary" type="button">➡ 下一題</button>
</div>
<div id="status" class="status">準備開始…</div>
</section>

</main>

oun","/rɪˌlaɪəˈbɪləti/","Reliability testing revealed a weakness in the hinge.","core"],["robustness","穩健性","noun","/roʊˈbʌstnəs/","The design needs more robustness against assembly variation.","core"],["cost reduction","成本降低","noun","/kɔːst rɪˈdʌkʃən/","We achieved cost reduction by simplifying the bracket.","core"],["weight reduction","減重","noun","/weɪt rɪˈdʌkʃən/","Weight reduction was achieved without sacrificing stiffness.","core"],["design optimization","設計最佳化","noun","/dɪˈzaɪn ˌɑːptəməˈzeɪʃən/","Design optimization improved stiffness and reduced material usage.","core"],["thermal expansion","熱膨脹","noun","/ˈθɜːrməl ɪkˈspænʃən/","Thermal expansion can affect the camera alignment.","thermal"],["coefficient of thermal expansion (CTE)","熱膨脹係數","noun","/ˌkoʊəˈfɪʃənt əv ˈθɜːrməl ɪkˈspænʃən/","The CTE mismatch can create stress at the interface.","thermal"],["heat transfer","熱傳遞","noun","/hiːt ˈtrænsfɜːr/","The housing improves heat transfer to the surrounding air.","thermal"],["thermal gradient","溫度梯度","noun","/ˈθɜːrməl ˈɡreɪdiənt/","A large thermal gradient can cause deformation.","thermal"],["thermal cycling","溫度循環","noun","/ˈθɜːrməl ˈsaɪklɪŋ/","Thermal cycling can reveal sealing and material compatibility issues.","thermal"],["heat spreader","均熱片","noun","/hiːt ˈsprɛdər/","A heat spreader distributes heat over a larger area.","thermal"],["thermal interface material (TIM)","導熱介面材料","noun","/ˈθɜːrməl ˈɪntərfeɪs məˈtɪriəl/","The TIM reduces thermal contact resistance.","thermal"],["thermal contact resistance","接觸熱阻","noun","/ˈθɜːrməl ˈkɑːntækt rɪˈzɪstəns/","Surface flatness affects thermal contact resistance.","thermal"],["heat generation","發熱量","noun","/hiːt ˌdʒɛnəˈreɪʃən/","We estimated heat generation from the electronics.","thermal"]];
const state={quiz:[],index:0,score:0,answered:false,lastAnswer:"",lastCorrect:false,currentOptions:[]};

function keyOf(v){return String(v??"").trim().toLowerCase().replace(/\s+/g," ")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function categoryName(v){return v||"工程英文"}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function makeOptions(correct){
 const pool=WORDS.filter(w=>keyOf(w[0])!==keyOf(correct[0]));
 const picked=[];const used=new Set([keyOf(correct[0])]);
 while(picked.length<3&&pool.length){
   const i=Math.floor(Math.random()*pool.length),item=pool.splice(i,1)[0];
   if(!used.has(keyOf(item[0]))){used.add(keyOf(item[0]));picked.push(item)}
 }
 return shuffle([correct,...picked]);
}

function setStatus(t,type=""){const e=document.getElementById("status");e.textContent=t;e.className="status "+type}

function render(){
 const x=state.quiz[state.index];if(!x)return;
 document.getElementById("progress").textContent=`題目 ${state.index+1} / ${state.quiz.length}`;
 document.getElementById("badge").textContent=categoryName(x[6]);
 document.getElementById("meaning").textContent=`「${x[1]}」`;
 document.getElementById("score").textContent=state.score;
 document.getElementById("total").textContent=state.quiz.length;

 if(state.currentOptions.length!==4)state.currentOptions=makeOptions(x);

 document.getElementById("options").innerHTML=state.currentOptions.map((w,i)=>
  `<button type="button" class="option" data-answer="${esc(w[0])}">${String.fromCharCode(65+i)}. ${esc(w[0])}</button>`
 ).join("");

 document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>checkChoice(b.dataset.answer)));

 document.getElementById("result").classList.toggle("hidden",!state.answered);

 if(state.answered){
   document.getElementById("yourAnswer").textContent=state.lastAnswer||"（未作答）";
   document.getElementById("correctEnglish").textContent=x[0];
   document.getElementById("correctChinese").textContent=x[1];
   document.getElementById("example").textContent=x[4]?"Example: "+x[4]:"";
   const title=document.getElementById("resultTitle");
   title.className="result-title "+(state.lastCorrect?"ok":"bad");
   title.textContent=state.lastCorrect?"✅ 正確！":"❌ 不正確，請記住正確答案";

   // 重要：直接使用 state.currentOptions，不重新隨機。
   const grid=document.getElementById("reviewGrid");
grid.innerHTML="";
state.currentOptions.forEach((w,i)=>{
  const item=document.createElement("div");
  item.className="review-item "+(keyOf(w[0])===keyOf(x[0])?"answer":"");
  const en=document.createElement("div");
  en.className="review-en";
  en.textContent=String.fromCharCode(65+i)+". "+w[0];
  const zh=document.createElement("div");
  zh.className="review-zh";
  zh.textContent=w[1];
  const btn=document.createElement("button");
  btn.type="button";
  btn.className="play-word";
  btn.textContent="🔊 播放發音";
  btn.addEventListener("click",()=>speakEnglish(w[0]));
  item.append(en,zh,btn);
  grid.appendChild(item);
});
 }
}

function checkChoice(answer){
 if(state.answered)return;
 const x=state.quiz[state.index];
 state.answered=true;state.lastAnswer=answer;state.lastCorrect=keyOf(answer)===keyOf(x[0]);
 if(state.lastCorrect)state.score++;
 render();
 document.querySelectorAll(".option").forEach(b=>{
   b.classList.add("disabled");
   if(keyOf(b.dataset.answer)===keyOf(x[0]))b.classList.add("correct");
   else if(keyOf(b.dataset.answer)===keyOf(answer))b.classList.add("wrong");
 });
 setStatus(state.lastCorrect?"✅ 答對了！":"❌ 答錯了，下面顯示的是原本 4 個選項的中文。",state.lastCorrect?"ok":"bad");
}

function revealAnswer(){
 if(state.answered)return;
 const x=state.quiz[state.index];
 state.answered=true;state.lastAnswer="（未作答）";state.lastCorrect=false;
 render();
 document.querySelectorAll(".option").forEach(b=>{
   b.classList.add("disabled");
   if(keyOf(b.dataset.answer)===keyOf(x[0]))b.classList.add("correct");
 });
 setStatus("👁 已顯示答案與原本 4 個選項的中文對照。");
}

function nextQuestion(){
 if(!state.answered){setStatus("請先選擇答案，或按「顯示答案」。","bad");return}
 if(state.index>=state.quiz.length-1){setStatus(`🎉 題庫完成！你的成績是 ${state.score} / ${state.quiz.length}。`,"ok");return}
 state.index++;state.answered=false;state.lastAnswer="";state.lastCorrect=false;state.currentOptions=[];
 render();refreshSpeakingButtons();setStatus("下一題：請選出正確英文。");
}

function startQuiz(){
 state.quiz=shuffle(WORDS.slice());state.index=0;state.score=0;state.answered=false;state.lastAnswer="";state.lastCorrect=false;state.currentOptions=[];
 render();setupSpeaking();setStatus(`已隨機排列 ${state.quiz.length} 題。請開始作答。`);
}

document.getElementById("showAnswer").addEventListener("click",revealAnswer);
document.getElementById("next").addEventListener("click",nextQuestion);
startQuiz();refreshSpeakingButtons();

function speakEnglish(text){
 if(!("speechSynthesis" in window)){setStatus("此瀏覽器不支援英文發音。","bad");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US"; u.rate=0.85;
 speechSynthesis.speak(u);
}
function setupSpeaking(){
 const x=state.quiz[state.index];
 document.getElementById("targetWord").textContent=x?x[0]:"";
 document.querySelectorAll(".play-word").forEach(btn=>{
   btn.addEventListener("click",()=>speakEnglish(btn.dataset.speak));
 });
 document.getElementById("playTarget").onclick=()=>{if(x)speakEnglish(x[0])};
 document.getElementById("startSpeaking").onclick=()=>{
   if(!state.answered){
     document.getElementById("speechStatus").textContent="請先完成這一題的選擇題。";
     return;
   }
   const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!SR){
     document.getElementById("speechStatus").textContent="此瀏覽器不支援語音辨識；請用最新版 Chrome。";
     return;
   }
   const r=new SR();
   r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
   document.getElementById("speechStatus").textContent="🎙 正在聽，請朗讀上面的英文…";
   document.getElementById("speechResult").textContent="辨識中…";
   r.onresult=e=>{
     const heard=e.results[0][0].transcript;
     document.getElementById("speechResult").textContent=heard;
     const target=keyOf(x[0]), got=keyOf(heard);
     document.getElementById("speechStatus").textContent=
       got===target?"✅ 辨識結果符合正確答案！":"⚠️ 辨識結果不同，可以再試一次。";
   };
   r.onerror=e=>document.getElementById("speechStatus").textContent="語音辨識失敗："+e.error;
   r.onend=()=>{ if(document.getElementById("speechStatus").textContent.includes("正在聽")) document.getElementById("speechStatus").textContent="已停止。"; };
   try{r.start()}catch(e){document.getElementById("speechStatus").textContent="無法啟動語音辨識，請再按一次。"}
 };
}

function refreshSpeakingButtons(){
  if(state.answered){
    const x=state.quiz[state.index];
    document.querySelectorAll(".play-word").forEach((b)=>{
      b.onclick=()=>speakEnglish(b.parentElement.querySelector(".review-en").textContent.replace(/^[A-D]\.\s*/,""));
    });
    const t=document.getElementById("targetWord");
    if(t&&x)t.textContent=x[0];
  }
}
</script>

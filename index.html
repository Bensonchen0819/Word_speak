s consistent with the engineering drawing."],["thermal gradient","溫度梯度","noun","/ˈθɜːrməl ˈɡreɪdiənt/","A large thermal gradient can cause deformation.","thermal","","The thermal gradient became a key consideration when we compared the two design concepts."],["thermal cycling","溫度循環","noun","/ˈθɜːrməl ˈsaɪklɪŋ/","Thermal cycling can reveal sealing and material compatibility issues.","thermal","","After the prototype failed the test, we investigated how the thermal cycling contributed to the issue."],["heat spreader","均熱片","noun","/hiːt ˈsprɛdər/","A heat spreader distributes heat over a larger area.","thermal","","From a DFM perspective, the heat spreader needs to be considered before the design is frozen."],["thermal interface material (TIM)","導熱介面材料","noun","/ˈθɜːrməl ˈɪntərfeɪs məˈtɪriəl/","The TIM reduces thermal contact resistance.","thermal","","Before releasing the design, the team checked the thermal interface material (TIM) against the product requirements."],["thermal contact resistance","接觸熱阻","noun","/ˈθɜːrməl ˈkɑːntækt rɪˈzɪstəns/","Surface flatness affects thermal contact resistance.","thermal","","The supplier raised a concern about the thermal contact resistance during the tooling review."],["heat generation","發熱量","noun","/hiːt ˌdʒɛnəˈreɪʃən/","We estimated heat generation from the electronics.","thermal","","We changed the design after testing showed that the heat generation was affecting product performance."]];
const state={quiz:[],index:0,score:0,answered:false,lastAnswer:"",lastCorrect:false,currentOptions:[]};

function keyOf(v){return String(v??"").trim().toLowerCase().replace(/\s+/g," ")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function categoryName(v){return v||"工程英文"}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function makeOptions(correct){
 const pool=WORDS.filter(w=>keyOf(w[0])!==keyOf(correct[0]));
 const picked=[];const used=new Set([keyOf(correct[0])]);
 while(picked.length<3&&pool.length){
   const i=Math.floor(Math.random()*pool.length),item=pool.splice(i,1)[0];
   if(!used.has(keyOf(item[0]))){used.add(keyOf(item[0]));picked.push(item)}
 }
 return shuffle([correct,...picked]);
}

function setStatus(t,type=""){const e=document.getElementById("status");e.textContent=t;e.className="status "+type}

function render(){
 const x=state.quiz[state.index];if(!x)return;
 document.getElementById("progress").textContent=`題目 ${state.index+1} / ${state.quiz.length}`;
 document.getElementById("badge").textContent=categoryName(x[6]);
 document.getElementById("meaning").textContent=`「${x[1]}」`;
// 口說區的「正確答案」永遠跟著目前題目同步
const targetWordEl=document.getElementById("targetWord");
if(targetWordEl) targetWordEl.textContent=x[0];

 document.getElementById("score").textContent=state.score;
 document.getElementById("total").textContent=state.quiz.length;

 if(state.currentOptions.length!==4)state.currentOptions=makeOptions(x);

 document.getElementById("options").innerHTML=state.currentOptions.map((w,i)=>
  `<button type="button" class="option" data-answer="${esc(w[0])}">${String.fromCharCode(65+i)}. ${esc(w[0])}</button>`
 ).join("");

 document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>checkChoice(b.dataset.answer)));

 document.getElementById("result").classList.toggle("hidden",!state.answered);

 if(state.answered){
   document.getElementById("yourAnswer").textContent=state.lastAnswer||"（未作答）";
   document.getElementById("correctEnglish").textContent=x[0];
   document.getElementById("correctChinese").textContent=x[1];
   document.getElementById("example").textContent=x[4]?"Example: "+x[4]:"";
   const title=document.getElementById("resultTitle");
   title.className="result-title "+(state.lastCorrect?"ok":"bad");
   title.textContent=state.lastCorrect?"✅ 正確！":"❌ 不正確，請記住正確答案";

   // 重要：直接使用 state.currentOptions，不重新隨機。
   const grid=document.getElementById("reviewGrid");
grid.innerHTML="";
state.currentOptions.forEach((w,i)=>{
  const item=document.createElement("div");
  item.className="review-item "+(keyOf(w[0])===keyOf(x[0])?"answer":"");

  const en=document.createElement("div");
  en.className="review-en";
  en.textContent=String.fromCharCode(65+i)+". "+w[0];

  const zh=document.createElement("div");
  zh.className="review-zh";
  zh.textContent=w[1];

  const sentence=document.createElement("div");
  sentence.className="review-sentence";
  sentence.innerHTML="<strong>Example:</strong> "+esc(w[7]||"");

  const playSentence=document.createElement("button");
  playSentence.type="button";
  playSentence.className="play-word";
  playSentence.textContent="🔊 播放例句";
  playSentence.addEventListener("click",()=>speakEnglish(w[7]||""));

  const play=document.createElement("button");
  play.type="button";
  play.className="play-word";
  play.textContent="🔊 播放發音";
  play.addEventListener("click",()=>speakEnglish(w[0]));

  item.append(en,zh,sentence,playSentence,play);
  grid.appendChild(item);
});
 }
}

function checkChoice(answer){
 if(state.answered)return;
 const x=state.quiz[state.index];
 state.answered=true;state.lastAnswer=answer;state.lastCorrect=keyOf(answer)===keyOf(x[0]);
 if(state.lastCorrect)state.score++;
 render();
 document.querySelectorAll(".option").forEach(b=>{
   b.classList.add("disabled");
   if(keyOf(b.dataset.answer)===keyOf(x[0]))b.classList.add("correct");
   else if(keyOf(b.dataset.answer)===keyOf(answer))b.classList.add("wrong");
 });
 setStatus(state.lastCorrect?"✅ 答對了！":"❌ 答錯了，下面顯示的是原本 4 個選項的中文。",state.lastCorrect?"ok":"bad");
}

function revealAnswer(){
 if(state.answered)return;
 const x=state.quiz[state.index];
 state.answered=true;state.lastAnswer="（未作答）";state.lastCorrect=false;
 render();
 document.querySelectorAll(".option").forEach(b=>{
   b.classList.add("disabled");
   if(keyOf(b.dataset.answer)===keyOf(x[0]))b.classList.add("correct");
 });
 setStatus("👁 已顯示答案與原本 4 個選項的中文對照。");
}

function nextQuestion(){
 if(!state.answered){setStatus("請先選擇答案，或按「顯示答案」。","bad");return}
 if(state.index>=state.quiz.length-1){setStatus(`🎉 題庫完成！你的成績是 ${state.score} / ${state.quiz.length}。`,"ok");return}
 state.index++;state.answered=false;state.lastAnswer="";state.lastCorrect=false;state.currentOptions=[];
 render();refreshSpeakingButtons();setStatus("下一題：請選出正確英文。");
}

function startQuiz(){
 state.quiz=shuffle(WORDS.slice());state.index=0;state.score=0;state.answered=false;state.lastAnswer="";state.lastCorrect=false;state.currentOptions=[];
 render();setupSpeaking();setStatus(`已隨機排列 ${state.quiz.length} 題。請開始作答。`);
}

document.getElementById("showAnswer").addEventListener("click",revealAnswer);
document.getElementById("next").addEventListener("click",nextQuestion);
startQuiz();refreshSpeakingButtons();

function speakEnglish(text){
 if(!("speechSynthesis" in window)){setStatus("此瀏覽器不支援英文發音。","bad");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US"; u.rate=0.85;
 speechSynthesis.speak(u);
}
function setupSpeaking(){
 const x=state.quiz[state.index];
 document.getElementById("targetWord").textContent=x?x[0]:"";
 document.querySelectorAll(".play-word").forEach(btn=>{
   btn.addEventListener("click",()=>speakEnglish(btn.dataset.speak));
 });
 document.getElementById("playTarget").onclick=()=>{
  const current=state.quiz[state.index];
  if(current) speakEnglish(current[0]);
};
 document.getElementById("startSpeaking").onclick=()=>{
   if(!state.answered){
     document.getElementById("speechStatus").textContent="請先完成這一題的選擇題。";
     return;
   }
   const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!SR){
     document.getElementById("speechStatus").textContent="此瀏覽器不支援語音辨識；請用最新版 Chrome。";
     return;
   }
   const r=new SR();
   r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
   document.getElementById("speechStatus").textContent="🎙 正在聽，請朗讀上面的英文…";
   document.getElementById("speechResult").textContent="辨識中…";
   r.onresult=e=>{
     const heard=e.results[0][0].transcript;
     document.getElementById("speechResult").textContent=heard;
     const target=keyOf(x[0]), got=keyOf(heard);
     document.getElementById("speechStatus").textContent=
       got===target?"✅ 辨識結果符合正確答案！":"⚠️ 辨識結果不同，可以再試一次。";
   };
   r.onerror=e=>document.getElementById("speechStatus").textContent="語音辨識失敗："+e.error;
   r.onend=()=>{ if(document.getElementById("speechStatus").textContent.includes("正在聽")) document.getElementById("speechStatus").textContent="已停止。"; };
   try{r.start()}catch(e){document.getElementById("speechStatus").textContent="無法啟動語音辨識，請再按一次。"}
 };
}

function refreshSpeakingButtons(){
  if(state.answered){
    const x=state.quiz[state.index];
    document.querySelectorAll(".play-word").forEach((b)=>{
      b.onclick=()=>speakEnglish(b.parentElement.querySelector(".review-en").textContent.replace(/^[A-D]\.\s*/,""));
    });
    const t=document.getElementById("targetWord");
    if(t&&x)t.textContent=x[0];
  }
}
</script>
</body>

ching","拉伸","↔","/ˈstretʃɪŋ/","The sheet is formed by stretching.","manufacturing","","The material was evaluated for stretching before we finalized the forming design.","在機械工程專案中，我們會根據實際需求評估「stretching」。"],["burr","毛邊","⚠","/bɜːr/","We need to remove the burr after machining.","manufacturing","","Please remove the burr around the punched hole before assembly.","組裝前請先去除沖孔周圍的毛邊。"],["indentation","壓痕","▾","/ˌɪndenˈteɪʃən/","There is an indentation on the surface.","manufacturing","","The inspection found a small indentation on the cosmetic surface.","在機械工程專案中，我們會根據實際需求評估「indentation」。"],["engraving","刻印","✒","/ɪnˈɡreɪvɪŋ/","The serial number is engraved on the housing.","manufacturing","","The part number is added by engraving after the surface treatment.","在機械工程專案中，我們會根據實際需求評估「engraving」。"],["laser engraving","雷雕","▣","/ˈleɪzər ɪnˌɡreɪvɪŋ/","Laser engraving is used for product identification.","manufacturing","","Laser engraving provides a durable identification mark without using a label.","在機械工程專案中，我們會根據實際需求評估「laser engraving」。"],["grinding","研磨","⚙","/ˈɡraɪndɪŋ/","Grinding improves dimensional accuracy.","manufacturing","","The sealing surface was finished by grinding to meet the required flatness.","這項「grinding」製程必須達到要求的尺寸精度與表面品質。"],["polishing","拋光","✦","/ˈpɑːlɪʃɪŋ/","Polishing improves the surface finish.","manufacturing","","Polishing reduced the surface roughness and improved the cosmetic appearance.","在機械工程專案中，我們會根據實際需求評估「polishing」。"],["mold","模具","🧰","/moʊld/","The mold needs regular maintenance.","manufacturing","","The mold was modified after the first trial revealed a filling issue.","在模具設計審查時，我們檢查了「mold」，以降低量產風險。"],["slider","滑塊","↔","/ˈslaɪdər/","The slider creates the side feature.","manufacturing","","The slider creates the side feature that cannot be formed with a simple vertical mold opening.","在機械工程專案中，我們會根據實際需求評估「slider」。"],["angled pin","斜銷","📐","/ˈæŋɡəld pɪn/","The angled pin releases the undercut.","manufacturing","","The angled pin drives the slider during mold opening.","在機械工程專案中，我們會根據實際需求評估「angled pin」。"],["shut-off","靠破","▣","/ˈʃʌt ɔːf/","The shut-off surface must seal properly.","manufacturing","","The shut-off surface must seal properly to prevent plastic from leaking into the feature.","在機械工程專案中，我們會根據實際需求評估「shut-off」。"],["air trap","包風","💨","/er træp/","The mold flow has an air trap.","manufacturing","","The mold vent was improved after an air trap caused a burn mark.","在機械工程專案中，我們會根據實際需求評估「air trap」。"],["parting line","結合線／分模線","—","/ˈpɑːrtɪŋ laɪn/","The parting line is visible on the housing.","manufacturing","","The parting line was relocated to avoid a visible cosmetic defect.","在機械工程專案中，我們會根據實際需求評估「parting line」。"],["stress line","應力痕","〰","/stres laɪn/","A stress line appeared after molding.","manufacturing","","A visible stress line appeared near the screw boss after tightening.","我們評估了「stress line」，以確認零件能承受預期的負載。"],["ejector mark","頂針痕","⊙","/ɪˈdʒektər mɑːrk/","The ejector mark is visible on the back side.","manufacturing","","The ejector mark is acceptable because it is located on a hidden surface.","在模具設計審查時，我們檢查了「ejector mark」，以降低量產風險。"],["core","公模","▰","/kɔːr/","The core forms the internal feature.","manufacturing","","The core forms the internal geometry of the molded housing.","在機械工程專案中，我們會根據實際需求評估「core」。"],["cavity","母模","▱","/ˈkævəti/","The cavity forms the external surface.","manufacturing","","The cavity defines the external surface of the plastic part.","在機械工程專案中，我們會根據實際需求評估「cavity」。"],["advantage","優點","👍","/ədˈvæntɪdʒ/","One advantage is lower assembly cost.","interview","","One advantage of this design is that it reduces the number of assembly steps.","在機械工程專案中，我們會根據實際需求評估「advantage」。"],["shortcoming","缺點","👎","/ˈʃɔːrtkʌmɪŋ/","The main shortcoming is the added weight.","interview","","The main shortcoming of the concept is the limited space for the connector.","在機械工程專案中，我們會根據實際需求評估「shortcoming」。"],["impatient","個性著急","⏱","/ɪmˈpeɪʃənt/","I can become impatient when a project is delayed.","interview","","Before releasing the design, the team checked the impatient against the product requirements.","在機械工程專案中，我們會根據實際需求評估「impatient」。"],["interference","干涉","🚧","/ˌɪntərˈfɪrəns/","We found interference between the bracket and housing.","interview","","The lens barrel showed interference with the housing during the fit check.","在裝配檢查時，我們發現鏡筒與外殼之間有干涉。"],["efficiency","效率","⚡","/ɪˈfɪʃənsi/","We improved assembly efficiency by simplifying the design.","interview","","We improved assembly efficiency by combining two operations into one fixture.","在機械工程專案中，我們會根據實際需求評估「efficiency」。"],["innovative","創新的","💡","/ˈɪnəveɪtɪv/","We developed an innovative cooling solution.","interview","","The team proposed an innovative mechanism that reduced both part count and assembly time.","在機械工程專案中，我們會根據實際需求評估「innovative」。"],["comprehensive","綜合的","📋","/ˌkɑːmprɪˈhensɪv/","We performed a comprehensive design review.","interview","","We performed a comprehensive review covering structure, thermal performance, and manufacturability.","在機械工程專案中，我們會根據實際需求評估「comprehensive」。"],["familiar","熟悉的","🤝","/fəˈmɪliər/","I am familiar with injection molding.","interview","","I am familiar with tolerance stack-up, GD&T, and mechanical validation methods.","在機械工程專案中，我們會根據實際需求評估「familiar」。"],["similar","相似的","≈","/ˈsɪmələr/","We compared it with a similar product.","interview","","The two concepts are similar, but the second one provides better access for assembly.","在機械工程專案中，我們會根據實際需求評估「similar」。"],["specific","具體的","🎯","/spəˈsɪfɪk/","Please provide a specific example.","interview","","The drawing must specify the exact surface finish and tolerance requirements.","在機械工程專案中，我們會根據實際需求評估「specific」。"],["essential","基本／不可或缺","★","/ɪˈsenʃəl/","Thermal validation is essential for this product.","interview","","A clear datum structure is essential for consistent inspection and assembly.","在機械工程專案中，我們會根據實際需求評估「essential」。"],["shipments","出貨量","📦","/ˈʃɪpmənts/","The monthly shipments increa const state={quiz:[],index:0,score:0,answered:false,lastAnswer:"",lastCorrect:false,currentOptions:[]};

function keyOf(v){return String(v??"").trim().toLowerCase().replace(/\s+/g," ")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function categoryName(v){return v||"工程英文"}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function makeOptions(correct){
 const pool=WORDS.filter(w=>keyOf(w[0])!==keyOf(correct[0]));
 const picked=[];const used=new Set([keyOf(correct[0])]);
 while(picked.length<3&&pool.length){
   const i=Math.floor(Math.random()*pool.length),item=pool.splice(i,1)[0];
   if(!used.has(keyOf(item[0]))){used.add(keyOf(item[0]));picked.push(item)}
 }
 return shuffle([correct,...picked]);
}

  const playSentence=document.createElement("button");
  playSentence.type="button";
  playSentence.className="play-word";
  playSentence.textContent="🔊 播放例句";
  playSentence.addEventListener("click",()=>speakEnglish(w[7]||""));

  const play=document.createElement("button");
  play.type="button";
  play.className="play-word";
  play.textContent="🔊 播放發音";
  play.addEventListener("click",()=>speakEnglish(w[0]));

  item.append(en,zh,sentence,playSentence,play);
  grid.appendChild(item);
});
 }
}

function checkChoice(answer){
 if(state.answered)return;
 const x=state.quiz[state.index];
 state.answered=true;state.lastAnswer=answer;state.lastCorrect=keyOf(answer)===keyOf(x[0]);
 if(state.lastCorrect)state.score++;
 render();
 document.querySelectorAll(".option").forEach(b=>{
   b.classList.add("disabled");
   if(keyOf(b.dataset.answer)===keyOf(x[0]))b.classList.add("correct");
   else if(keyOf(b.dataset.answer)===keyOf(answer))b.classList.add("wrong");
 });
 setStatus(state.lastCorrect?"✅ 答對了！":"❌ 答錯了，下面顯示的是原本 4 個選項的中文。",state.lastCorrect?"ok":"bad");
}

function revealAnswer(){
 if(state.answered)return;
 const x=state.quiz[state.index];
 state.answered=true;state.lastAnswer="（未作答）";state.lastCorrect=false;
 render();
 document.querySelectorAll(".option").forEach(b=>{
   b.classList.add("disabled");
   if(keyOf(b.dataset.answer)===keyOf(x[0]))b.classList.add("correct");
 });
 setStatus("👁 已顯示答案與原本 4 個選項的中文對照。");
}

function nextQuestion(){
 if(!state.answered){setStatus("請先選擇答案，或按「顯示答案」。","bad");return}
 if(state.index>=state.quiz.length-1){setStatus(`🎉 題庫完成！你的成績是 ${state.score} / ${state.quiz.length}。`,"ok");return}
 state.index++;state.answered=false;state.lastAnswer="";state.lastCorrect=false;state.currentOptions=[];
 render();refreshSpeakingButtons();setStatus("下一題：請選出正確英文。");
}

function startQuiz(){
 state.quiz=shuffle(WORDS.slice());state.index=0;state.score=0;state.answered=false;state.lastAnswer="";state.lastCorrect=false;state.currentOptions=[];
 render();setupSpeaking();setStatus(`已隨機排列 ${state.quiz.length} 題。請開始作答。`);
}

document.getElementById("showAnswer").addEventListener("click",revealAnswer);
document.getElementById("next").addEventListener("click",nextQuestion);
startQuiz();refreshSpeakingButtons();

function speakEnglish(text){
 if(!("speechSynthesis" in window)){setStatus("此瀏覽器不支援英文發音。","bad");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US"; u.rate=0.85;
 speechSynthesis.speak(u);
}
function setupSpeaking(){
 const x=state.quiz[state.index];
 document.getElementById("targetWord").textContent=x?x[0]:"";
 document.querySelectorAll(".play-word").forEach(btn=>{
   btn.addEventListener("click",()=>speakEnglish(btn.dataset.speak));
 });
 document.getElementById("playTarget").onclick=()=>{
  const current=state.quiz[state.index];
  if(current) speakEnglish(current[0]);
};
 document.getElementById("startSpeaking").onclick=()=>{
   if(!state.answered){
     document.getElementById("speechStatus").textContent="請先完成這一題的選擇題。";
     return;
   }
   const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!SR){
     document.getElementById("speechStatus").textContent="此瀏覽器不支援語音辨識；請用最新版 Chrome。";
     return;
   }
   const r=new SR();
   r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
   document.getElementById("speechStatus").textContent="🎙 正在聽，請朗讀上面的英文…";
   document.getElementById("speechResult").textContent="辨識中…";
   r.onresult=e=>{
     const heard=e.results[0][0].transcript;
     document.getElementById("speechResult").textContent=heard;
     const target=keyOf(x[0]), got=keyOf(heard);
     document.getElementById("speechStatus").textContent=
       got===target?"✅ 辨識結果符合正確答案！":"⚠️ 辨識結果不同，可以再試一次。";
   };
   r.onerror=e=>document.getElementById("speechStatus").textContent="語音辨識失敗："+e.error;
   r.onend=()=>{ if(document.getElementById("speechStatus").textContent.includes("正在聽")) document.getElementById("speechStatus").textContent="已停止。"; };
   try{r.start()}catch(e){document.getElementById("speechStatus").textContent="無法啟動語音辨識，請再按一次。"}
 };
}

function refreshSpeakingButtons(){
  if(state.answered){
    const x=state.quiz[state.index];
    document.querySelectorAll(".play-word").forEach((b)=>{
      b.onclick=()=>speakEnglish(b.parentElement.querySelector(".review-en").textContent.replace(/^[A-D]\.\s*/,""));
    });
    const t=document.getElementById("targetWord");
    if(t&&x)t.textContent=x[0];
  }
}
</script>
